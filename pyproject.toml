[project]
name = "dental-client-management-backend"
version = "0.1.0"
description = "FastAPI + MongoDB backend for a dental patient management app, with case sheets, dashboard stats, and grounded AI summaries and chat."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "limits>=5.8.0",
    "pydantic-settings>=2.15.0",
    "pymongo>=4.18.1",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
